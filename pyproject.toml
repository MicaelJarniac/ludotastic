[project]
name = "ludotastic"
version = "0.2.1"
description = "Where humans and AI come to play."
authors = [
  {name = "Micael Jarniac", email = "micael@jarniac.dev"},
]
license = {text = "MIT"}
readme = "docs/README.md"
classifiers = [
  # Get more from http://pypi.python.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 2 - Pre-Alpha",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  # https://github.com/astral-sh/uv/issues/8716
  "License :: OSI Approved :: MIT License",
  # Keep in sync with `requires-python` and `.python-versions`.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.14"  # py_ver
dependencies = [
    "fastapi>=0.162.0",
    "loguru>=0.7.3",
    "nicegui>=4.0.0",
    "pillow>=12",
    "platformdirs>=4.3",
    "pydantic-ai-slim[anthropic,google,openai,typesafe]>=2.66.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
]

[project.scripts]
ludotastic = "ludotastic.cli:main"

# Games are plugins: any installed package can add one to this group.
# The bundled games register here exactly like third-party ones.
[project.entry-points."ludotastic.games"]
2048 = "ludotastic.games.twentyfortyeight:TwentyFortyEight"
rock-paper-scissors = "ludotastic.games.rock_paper_scissors:RockPaperScissors"
snake = "ludotastic.games.snake:Snake"
tictactoe = "ludotastic.games.tictactoe:TicTacToe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://github.com/MicaelJarniac/ludotastic"
source = "https://github.com/MicaelJarniac/ludotastic"
download = "https://pypi.org/project/ludotastic/#files"
changelog = "https://github.com/MicaelJarniac/ludotastic/blob/main/docs/CHANGELOG.md"
documentation = "https://ludotastic.readthedocs.io"
issues = "https://github.com/MicaelJarniac/ludotastic/issues"

[dependency-groups]
tests = [
    "coverage>=7.6.11",
    "hypothesis>=6.125.3",
    "inline-snapshot>=0.20.2",
    "pytest>=8.3.4",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=6.0.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.2",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
]
typing = [
    {include-group = "tests"},
    {include-group = "automation"},
    "ty>=0.0.75",
    # Typing stubs go here
]
linting = [
    "ruff>=0.9.6",
]
pre-commit = [
    "pre-commit>=4.1.0",
]
release = [
    "python-semantic-release>=10.6.1",
]
automation = [
    # 2026.2.9 passes `uv venv --clear`, which uv>=0.10 requires to replace an
    # existing venv. Older nox left the directory for uv to clobber, so every
    # session failed on its second local run.
    "nox[uv]>=2026.2.9",
]
dev = [
    {include-group = "tests"},
    {include-group = "docs"},
    {include-group = "typing"},
    {include-group = "linting"},
    {include-group = "pre-commit"},
    {include-group = "automation"},
    {include-group = "release"},
    "ipython>=8.18.1",
]

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
line-length = 88  # Default
force-exclude = true
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
  "ISC001",
  # Per-file copyright headers: the top-level LICENSE covers the project.
  "CPY001",
  # Games need seeded, reproducible randomness, not cryptographic randomness.
  "S311",
  # Pydantic, FastAPI, Typer, NiceGUI and pytest read annotations at runtime, so
  # imports used only in annotations still have to be importable.
  "TC001",
  "TC002",
  "TC003",
]
unfixable = ["ERA001"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point. PLR2004: magic numbers are fixture data.
# S106/S107: "tokens" here are literal test fixtures, not credentials.
"tests/*" = [
  "S101", "PLR2004", "S106", "S107", "D101", "D102", "D103", "ARG001", "ARG005",
  "E501", "ASYNC110",
]
# Typer reads options from the signature.
"src/ludotastic/cli.py" = ["FBT002", "PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "type"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "docs", "tests", "noxfile.py"]

[tool.ty.rules]
# Fail on every diagnostic, not just the ones ty reports as errors by default.
all = "error"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Keep releasing 0.x. PSR v10 flipped this default to false, which would
# promote the next release to 1.0.0 and declare the API stable.
allow_zero_version = true
# While pre-1.0, a breaking change bumps the minor rather than promoting to
# 1.0.0. This lets a breaking commit be marked honestly with `!` or a
# BREAKING CHANGE footer without accidentally declaring the API stable;
# reaching 1.0.0 stays a deliberate decision.
major_on_zero = false
build_command = """
  pip install uv
  uv lock
  git add uv.lock
  uv build
"""

[tool.semantic_release.changelog]
# PSR v10 changed this default from "init" (rewrite the whole file every
# release) to "update" (splice the new version in at `insertion_flag`). In
# update mode a changelog without the flag is written back byte-for-byte with
# no warning, so releases silently go unrecorded. Both values are pinned so a
# future default change cannot silently do it again, and docs/CHANGELOG.md
# must keep the flag right under its title; tests/test_changelog.py enforces
# that.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.branches.rc]
match = "rc"
prerelease = true
prerelease_token = "rc"

[tool.coverage.run]
source = ["src"]
command_line = "-m pytest"
# Line coverage alone reports a line green even when only one side of a
# conditional on it ever runs. Branches catch that.
branch = true

[tool.coverage.report]
# The bar is 100% (docs/CONTRIBUTING.md), so make `pytest --cov` say so
# instead of leaving it to Codecov to notice after the fact.
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
# addopts = "--cov"
# Docstring examples are part of the docs; keep them running.
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
  # Unclosed resources (files, sockets, database connections) left to the
  # garbage collector surface as a ResourceWarning at finalization. Both lines
  # are needed to fail the run: the warning is raised inside a finalizer,
  # where it cannot propagate, so Python hands it to `sys.unraisablehook` and
  # pytest re-reports it as PytestUnraisableExceptionWarning.
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.cruft]
skip = [
  "src",
  "tests",
  "uv.lock",
]
